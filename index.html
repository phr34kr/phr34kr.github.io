<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>phr34kr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000;
        --ink: #e8e4da;
        --muted: #79746b;
        --red: #db1020;
        --line: #292927;
        --paper: #e7e2d5;
        --paper-ink: #16130d;
        --maxw: 1500px;
        --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --type: "Special Elite", "Courier New", monospace;
        --mono: "Space Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.4;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 clamp(1rem, 4vw, 3rem);
      }

      /* ---------- Masthead ---------- */
      .masthead {
        padding: 1.8rem 0 1.3rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.55rem;
      }
      .masthead .mark {
        width: 30px;
        height: auto;
      }
      .masthead .logo {
        width: 132px;
        height: auto;
      }
      .stamp {
        display: inline-block;
        color: var(--red);
        font-family: var(--type);
        letter-spacing: 0.1em;
        padding: 0.12rem 0.55rem;
        font-size: 0.8rem;
      }

      /* ---------- Toolbar ---------- */
      .toolbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 1.2rem 0 0.2rem;
      }
      .toolbar h1 {
        font-family: var(--type);
        font-weight: 400;
        margin: 0;
        font-size: clamp(1.4rem, 3.5vw, 2rem);
        letter-spacing: 0.01em;
      }
      .toolbar .count {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--muted);
        letter-spacing: 0.12em;
      }
      .search {
        position: relative;
        flex: 1 1 220px;
        max-width: 320px;
      }
      .search input {
        width: 100%;
        background: transparent;
        border: 0;
        border-bottom: 1px dashed #44423d;
        color: var(--ink);
        font-family: var(--mono);
        font-size: 0.82rem;
        padding: 0.4rem 0.1rem;
      }
      .search input::placeholder {
        color: var(--muted);
      }
      .search input:focus {
        outline: none;
        border-bottom: 1px solid var(--red);
      }
      #results {
        position: absolute;
        top: calc(100% + 0.45rem);
        right: 0;
        z-index: 50;
        width: min(420px, 85vw);
        max-height: min(60vh, 460px);
        overflow-y: auto;
        background: #0c0c0c;
        border: 1px solid var(--line);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.7);
      }
      #results[hidden] {
        display: none;
      }
      .results-head {
        position: sticky;
        top: 0;
        background: #0c0c0c;
        font-family: var(--mono);
        font-size: 0.6rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.16em;
        padding: 0.55rem 0.85rem 0.45rem;
        border-bottom: 1px solid var(--line);
      }
      .result {
        display: block;
        padding: 0.5rem 0.85rem;
        border-left: 2px solid transparent;
      }
      .result:hover,
      .result:focus-visible {
        background: #161614;
        border-left-color: var(--red);
        outline: none;
      }
      .result .rt {
        font-size: 0.9rem;
        line-height: 1.25;
      }
      .result .ra {
        display: block;
        font-family: var(--mono);
        font-size: 0.63rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 0.15rem;
      }
      .results-empty {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0.85rem;
      }

      /* ---------- Featured ---------- */
      .featured {
        margin: 1.3rem 0 2rem;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .featured .lbl {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 0.66rem;
        color: var(--red);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        padding: 0.7rem 0 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .featured .lbl::before {
        content: "★";
        color: var(--red);
      }
      .featured ul {
        list-style: none;
        margin: 0;
        padding: 0.5rem 0 0.8rem;
      }
      .featured li {
        display: flex;
        gap: 0.6rem;
        align-items: baseline;
        padding: 0.4rem 0;
      }
      .featured li .tick {
        color: var(--red);
        font-family: var(--mono);
        font-size: 0.8rem;
      }
      .featured a {
        font-size: clamp(1rem, 1.8vw, 1.2rem);
        font-weight: 700;
      }
      .featured .byline {
        display: block;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 0.1rem;
      }

      /* ---------- Library: typed ledger, multi-column ---------- */
      .library {
        column-width: 20rem;
        column-gap: 2.6rem;
      }
      .group {
        break-inside: avoid;
        margin: 0 0 1.6rem;
        border-left: 2px solid var(--red);
        padding-left: 0.85rem;
      }
      .ghead {
        display: flex;
        align-items: baseline;
        gap: 0.55rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.3rem;
        margin-bottom: 0.5rem;
      }
      .ghead .sq {
        width: 8px;
        height: 8px;
        background: var(--red);
        flex: none;
        transform: translateY(-1px);
      }
      .ghead .gname {
        font-family: var(--mono);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.82rem;
        line-height: 1.2;
      }
      .group ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .group li {
        padding: 0.16rem 0;
        line-height: 1.32;
        display: flex;
        gap: 0.45rem;
      }
      .group li .dot {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.8rem;
        flex: none;
      }
      .group li a {
        font-size: 0.92rem;
        border-bottom: 1px solid transparent;
        transition:
          color 0.12s,
          border-color 0.12s;
      }
      .group li a:hover,
      .group li a:focus-visible {
        color: var(--red);
        border-bottom-color: var(--red);
        outline: none;
      }
      .group .byline {
        display: block;
        font-family: var(--mono);
        font-size: 0.66rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-top: 0.05rem;
      }
      .group.outros {
        border-left-color: #3a3a37;
        /* A cauda longa (autores de 1 título) flui entre as colunas: começa no
           espaço que sobra após o último grupo e continua nas colunas seguintes,
           em vez de virar um único bloco altíssimo. */
        break-inside: auto;
      }
      .group.outros .ghead {
        /* cabeçalho não fica órfão no fim de uma coluna */
        break-after: avoid;
      }
      .group.outros li {
        /* cada item (título + autor) permanece inteiro numa coluna */
        break-inside: avoid;
      }
      .group.outros .ghead .sq {
        background: #3a3a37;
      }

      /* ---------- Mídia / Organizações: index cards ---------- */
      .media {
        margin: 2.1rem 0 0;
      }
      .media .mhead {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 0.68rem;
        color: var(--ink);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .media .mhead::before {
        content: "■";
        color: var(--red);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
        gap: 0.85rem;
        margin-top: 1rem;
      }
      .cards--solo {
        grid-template-columns: repeat(auto-fill, minmax(240px, 300px));
      }
      .card {
        background: var(--paper);
        color: var(--paper-ink);
        padding: 0.8rem 0.75rem 0.85rem;
        border-top: 4px solid var(--red);
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        min-height: 120px;
        transition: transform 0.12s;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .card .logo {
        height: 32px;
        max-width: 100%;
        object-fit: contain;
        object-position: left center;
      }
      .card .name {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 0.68rem;
        text-transform: uppercase;
      }
      .card .tag {
        font-size: 0.71rem;
        line-height: 1.25;
        color: #4a443c;
        margin-top: auto;
      }
      .card.video {
        background: transparent;
        border-top: 0;
        padding: 0;
        min-height: 0;
        gap: 0;
      }
      .card.video .thumb {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #111 center / cover no-repeat;
        border-top: 4px solid var(--red);
      }
      .card.video .thumb::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.18);
        transition: background 0.12s;
      }
      .card.video:hover .thumb::before {
        background: rgba(0, 0, 0, 0.04);
      }
      .card.video .play {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 13px 0 13px 22px;
        border-color: transparent transparent transparent var(--red);
        filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.6));
      }
      .card.video .vtitle {
        font-family: var(--mono);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 0.66rem;
        line-height: 1.3;
        color: var(--ink);
        padding: 0.5rem 0.1rem 0;
      }

      footer {
        border-top: 1px solid var(--line);
        margin-top: 2.4rem;
        padding: 1rem 0 2.5rem;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        display: flex;
        justify-content: center;
        text-align: center;
      }
      footer .red {
        color: var(--red);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <img class="mark" src="mlm.png" alt="" />
        <img class="logo" src="logo.png" alt="phr34kr" />
        <span class="stamp">Rebelar-se é justo!</span>
      </header>

      <div class="toolbar">
        <h1>Biblioteca <span class="count" id="count"></span></h1>
        <div class="search">
          <input
            id="search"
            type="search"
            placeholder="buscar título ou autor…"
            aria-label="Buscar na biblioteca"
            autocomplete="off"
          />
          <div
            id="results"
            role="listbox"
            aria-label="Resultados da busca"
            hidden
          ></div>
        </div>
      </div>

      <section class="featured" id="featured">
        <div class="lbl">Em destaque</div>
        <ul id="featured-list"></ul>
      </section>

      <main class="library" id="library"></main>

      <section class="media">
        <h2 class="mhead">Mídia</h2>
        <div class="cards cards--solo" id="midia-list"></div>
      </section>

      <section class="media">
        <h2 class="mhead">Organizações</h2>
        <div class="cards" id="orgs-list"></div>
      </section>

      <footer>
        <span
          >Atualizado em
          <span class="red" id="last-updated">26/06/2026</span></span
        >
      </footer>
    </div>

    <!-- Todo o conteúdo (biblioteca, mídia, organizações e ordem dos autores)
     vive em data.js — edite aquele arquivo para atualizar o site. -->
    <script src="data.js"></script>
    <script>
      (function () {
        const D = window.SITE_DATA;
        const AUTHOR_ORDER = D.authorOrder;
        const OUTROS = "Outros autores";
        const norm = (s) =>
          s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
        const byTitle = (a, b) => a.title.localeCompare(b.title, "pt");
        // Author de uma obra → chave do grupo. Autores combinados ("Karl Marx
        // e Friedrich Engels") caem no primeiro autor do AUTHOR_ORDER que casa
        // por substring; os demais usam o próprio nome como chave.
        const groupOf = (a) => {
          for (const x of AUTHOR_ORDER) if (a.includes(x)) return x;
          return a;
        };
        const mk = (tag, cls, text) => {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          return e;
        };

        const books = D.books;

        function makeItem(b, withByline) {
          const li = mk("li");
          li.appendChild(mk("span", "dot", "–"));
          const box = mk("div");
          const a = mk("a", null, b.title);
          a.href = b.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          box.appendChild(a);
          if (withByline) box.appendChild(mk("span", "byline", b.author));
          li.appendChild(box);
          return li;
        }

        // Featured (highlighted works float to a "Em destaque" strip up top)
        const fList = document.getElementById("featured-list");
        for (const b of books.filter((b) => b.highlight).sort(byTitle)) {
          const li = mk("li");
          li.appendChild(mk("span", "tick", "■"));
          const box = mk("div");
          const a = mk("a", null, b.title);
          a.href = b.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          box.appendChild(a);
          box.appendChild(mk("span", "byline", b.author));
          li.appendChild(box);
          fList.appendChild(li);
        }

        // Biblioteca agrupada por autor.
        //  • O AUTHOR_ORDER define apenas quais autores aparecem primeiro (e em
        //    que ordem) — esses são sempre uma seção própria.
        //  • Qualquer outro autor com 2+ títulos também ganha a sua seção,
        //    listada em ordem alfabética depois das do AUTHOR_ORDER.
        //  • Autores com um único título caem em "Outros autores", no fim.
        const rest = books.filter((b) => !b.highlight);
        const groups = new Map();
        for (const b of rest) {
          const g = groupOf(b.author);
          if (!groups.has(g)) groups.set(g, []);
          groups.get(g).push(b);
        }

        // Autor ganha seção própria se está no AUTHOR_ORDER (curado) ou tem 2+
        // títulos; os de título único colapsam em "Outros autores".
        const outros = [];
        for (const k of [...groups.keys()]) {
          if (!AUTHOR_ORDER.includes(k) && groups.get(k).length < 2) {
            outros.push(...groups.get(k));
            groups.delete(k);
          }
        }

        // Ordem das seções: AUTHOR_ORDER primeiro, depois o resto em ordem
        // alfabética por autor, e "Outros autores" por último.
        const keys = AUTHOR_ORDER.filter((k) => groups.has(k)).concat(
          [...groups.keys()]
            .filter((k) => !AUTHOR_ORDER.includes(k))
            .sort((a, b) => a.localeCompare(b, "pt")),
        );
        if (outros.length) {
          groups.set(OUTROS, outros);
          keys.push(OUTROS);
        }

        const lib = document.getElementById("library");
        for (const key of keys) {
          const items = groups.get(key);
          const isOutros = key === OUTROS;
          items.sort(
            isOutros
              ? (a, b) =>
                  a.author.localeCompare(b.author, "pt") || byTitle(a, b)
              : byTitle,
          );
          const section = mk("section", "group" + (isOutros ? " outros" : ""));
          const head = mk("div", "ghead");
          head.appendChild(mk("span", "sq"));
          head.appendChild(mk("span", "gname", key));
          const ul = mk("ul");
          for (const b of items) ul.appendChild(makeItem(b, isOutros));
          section.appendChild(head);
          section.appendChild(ul);
          lib.appendChild(section);
        }

        // Mídia (vídeos) e Organizações
        const midiaList = document.getElementById("midia-list");
        for (const v of D.midia) {
          const a = mk("a", "card video");
          a.href = "https://www.youtube.com/watch?v=" + v.youtube;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.setAttribute(
            "aria-label",
            v.title ? "Assistir: " + v.title : "Assistir vídeo no YouTube",
          );
          const thumb = mk("span", "thumb");
          thumb.style.backgroundImage =
            "url('https://img.youtube.com/vi/" + v.youtube + "/hqdefault.jpg')";
          thumb.appendChild(mk("span", "play"));
          a.appendChild(thumb);
          if (v.title) a.appendChild(mk("span", "vtitle", v.title));
          midiaList.appendChild(a);
        }

        const orgsList = document.getElementById("orgs-list");
        for (const o of D.orgs) {
          const a = mk("a", "card");
          a.href = o.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          const img = mk("img", "logo");
          img.src = o.logo;
          img.alt = o.name;
          img.loading = "lazy";
          a.appendChild(img);
          a.appendChild(mk("span", "name", o.name));
          if (o.tagline) a.appendChild(mk("span", "tag", o.tagline));
          orgsList.appendChild(a);
        }

        // Toolbar count always reflects the full library.
        document.getElementById("count").textContent =
          "[ " + books.length + " obras ]";

        // Search — matches show in a separate dropdown; the library is never hidden.
        const searchIndex = books.map((b) => ({
          title: b.title,
          author: b.author,
          url: b.url,
          haystack: norm(b.title + " " + b.author),
        }));
        const search = document.getElementById("search");
        const results = document.getElementById("results");

        function renderResults(q) {
          const nq = norm(q);
          const matches = searchIndex
            .filter((e) => e.haystack.includes(nq))
            .sort(
              (a, b) => a.author.localeCompare(b.author, "pt") || byTitle(a, b),
            );
          results.textContent = "";
          results.appendChild(
            mk(
              "div",
              "results-head",
              matches.length +
                (matches.length === 1 ? " resultado" : " resultados"),
            ),
          );
          if (!matches.length) {
            results.appendChild(
              mk("div", "results-empty", "Nenhum resultado encontrado."),
            );
          } else {
            for (const m of matches) {
              const a = mk("a", "result");
              a.href = m.url;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.appendChild(mk("span", "rt", m.title));
              a.appendChild(mk("span", "ra", m.author));
              results.appendChild(a);
            }
          }
          results.hidden = false;
        }

        search.addEventListener("input", () => {
          const q = search.value.trim();
          if (q) renderResults(q);
          else results.hidden = true;
        });
        search.addEventListener("focus", () => {
          const q = search.value.trim();
          if (q) renderResults(q);
        });
        search.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            search.value = "";
            results.hidden = true;
          }
        });
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".search")) results.hidden = true;
        });

        // Auto "Atualizado em" from the file's publish time (static date is the no-JS fallback)
        const lu = document.getElementById("last-updated");
        const d = new Date(document.lastModified);
        if (lu && !isNaN(d.getTime()))
          lu.textContent = d.toLocaleDateString("pt-BR");
      })();
    </script>

      async
      src="https://www.googletagmanager.com/gtag/js?id=G-SDJH7C8GDF"

      window.dataLayer = window.dataLayer || [];

      gtag("js", new Date());

    </script>
  </body>
</html>
